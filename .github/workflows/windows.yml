name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify custom-path installation and removal
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "CMX installation test"
          $setup = Get-Item dist/*-windows-x64-setup.exe
          $install = Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS /DIR=`"$folder`"" -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installation failed ($($install.ExitCode))." }
          $exe = Join-Path $folder "CMX Material Manager.exe"
          $app = Start-Process $exe -WorkingDirectory $folder -ArgumentList "--smoke-test examples/demo.cmx" -WindowStyle Hidden -PassThru
          try {
              if (-not $app.WaitForExit(30000)) { $app.Kill(); throw "Installed app timed out." }
              if ($app.ExitCode -ne 0) { throw "Installed app failed ($($app.ExitCode))." }
          } finally {
              $remove = Start-Process (Join-Path $folder "unins000.exe") -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -WindowStyle Hidden -PassThru -Wait
              if ($remove.ExitCode -ne 0 -or (Test-Path $exe)) { throw "Uninstall failed." }
          }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: Windows-x64-installer
          path: dist/*-windows-x64-setup.exe
          if-no-files-found: error
